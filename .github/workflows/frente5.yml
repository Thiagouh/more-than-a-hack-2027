name: Frente 5 synthetic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install video tools for extraction checks
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m src.ball_events demo --out outputs/ci-demo
      - run: python -m src.ball_events replay --run outputs/ci-demo/run --drain --out outputs/ci-replay
